
spring.application.name=curated-culinary-creations

server.port=8080

# MySQL configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/curated_culinary_creations?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT authentication
# The fallback is for local development only.
# Replace it with a securely generated secret in deployment.
app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==}
app.jwt.expiration-ms=86400000

# Development only; review before deployment.
server.error.include-message=always
