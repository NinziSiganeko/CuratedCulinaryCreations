spring.application.name=curated-culinary-creations

# Backend port
server.port=8080

# MySQL database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/curated_culinary_creations?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Return readable error messages while developing.
# Revisit this before production deployment.
server.error.include-message=always
